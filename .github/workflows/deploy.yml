name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break_release_gate:
        description: Deliberately fail the release gate before deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify release gates
        env:
          BREAK_RELEASE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.break_release_gate || false }}
        run: node tests/release-gates.js
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
